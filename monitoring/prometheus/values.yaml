# ============================================================
# Prometheus Server 설정
# ============================================================
server:
  # monitoring=yes 라벨이 설정된 Node에만
  # Prometheus Server Pod를 배치한다.
  nodeSelector:
    monitoring: "yes"

  # Prometheus Web UI 접근을 위한 Service 설정
  service:
    # Node의 포트를 이용해 클러스터 외부에서 접근한다.
    type: NodePort

    # Prometheus Web UI 접속에 사용할 고정 NodePort
    # EC2 보안 그룹에서도 필요한 접속 범위에만 허용해야 한다.
    nodePort: 30090

  # Prometheus가 수집한 시계열 데이터를 저장할 PVC 설정
  #
  # 주의:
  # Prometheus Server는 persistentVolume이라는 설정 키를 사용한다.
  persistentVolume:
    # Pod가 재시작되거나 다시 생성돼도 메트릭을 보존하도록
    # 영속 저장소 사용을 활성화한다.
    enabled: true

    # Rancher Local Path Provisioner가 제공하는 StorageClass
    storageClass: local-path

    # 한 Node에서 볼륨을 읽고 쓸 수 있도록 설정한다.
    # local-path와 단일 Prometheus Server에 적합한 방식이다.
    accessModes:
      - ReadWriteOnce

    # Prometheus 메트릭 저장 공간
    size: 2Gi

  # Prometheus Server의 CPU와 메모리 설정
  resources:
    # Kubernetes가 Prometheus Pod를 배치할 때
    # 최소한 확보해야 하는 자원
    requests:
      cpu: 200m
      memory: 400Mi

    # Prometheus 컨테이너가 사용할 수 있는 최대 자원
    # 작은 학습용 클러스터의 과도한 자원 사용을 방지한다.
    limits:
      cpu: 500m
      memory: 768Mi

  # 수집한 시계열 메트릭을 7일 동안 보관한다.
  # 학습용 2Gi PVC의 저장 공간 소진을 완화하기 위한 설정이다.
  retention: 7d


# ============================================================
# Alertmanager 설정
# ============================================================
alertmanager:
  # Prometheus 경고를 처리하는 Alertmanager를 함께 설치한다.
  enabled: true

  # Alertmanager도 monitoring=yes 라벨이 설정된 Node에 배치한다.
  nodeSelector:
    monitoring: "yes"

  # Alertmanager의 알림 상태 데이터를 보관할 PVC 설정
  #
  # 주의:
  # Prometheus Server는 persistentVolume을 사용하지만,
  # Alertmanager 하위 Chart는 persistence라는 설정 키를 사용한다.
  persistence:
    # Alertmanager Pod가 재시작돼도 상태 데이터를 보존한다.
    enabled: true

    # Local Path Provisioner가 제공하는 StorageClass를 사용한다.
    storageClass: local-path

    # 한 Node에서 읽기/쓰기가 가능한 볼륨으로 설정한다.
    accessModes:
      - ReadWriteOnce

    # Alertmanager 상태 데이터 저장 공간
    size: 1Gi

  # Alertmanager의 CPU와 메모리 설정
  resources:
    # 스케줄링할 때 확보할 최소 자원
    requests:
      cpu: 50m
      memory: 128Mi

    # Alertmanager가 사용할 수 있는 최대 자원
    limits:
      cpu: 200m
      memory: 256Mi


# ============================================================
# kube-state-metrics 설정
# ============================================================
kube-state-metrics:
  # Deployment, Pod, ReplicaSet 등
  # Kubernetes 리소스의 상태 메트릭을 제공한다.
  enabled: true


# ============================================================
# Node Exporter 설정
# ============================================================
prometheus-node-exporter:
  # 각 Kubernetes Node의 CPU, 메모리, 디스크,
  # 네트워크 메트릭을 수집한다.
  #
  # Node Exporter는 DaemonSet으로 실행되므로
  # monitoring 전용 Node뿐 아니라 모든 Node에 하나씩 배치된다.
  enabled: true


# ============================================================
# Pushgateway 설정
# ============================================================
prometheus-pushgateway:
  # Pushgateway는 짧게 실행되고 종료되는 Batch Job이
  # 메트릭을 Push 방식으로 전달할 때 주로 사용한다.
  #
  # 현재 프로젝트는 계속 실행되는 Spring Backend와
  # Kubernetes 리소스를 Pull 방식으로 수집하므로 비활성화한다.
  enabled: false
