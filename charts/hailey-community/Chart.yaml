# Chart.yaml
apiVersion: v2              # Helm Chart API 버전. Helm 3에서는 v2 사용.
name: hailey-community      # 차트(Chart)의 이름. 배포 단위의 고유 식별자. 배포 시 릴리스 이름과 함께 사용되며, 디렉토리 이름과 일치하는 것이 일반적.
description: A Helm chart for deploying My hailey-community   # 차트의 목적·설명을 간단히 기술.
type: application           # 차트 유형. application(일반적 애플리케이션용, helm install로 배포 가능, 실제서비스구동) 또는 library(여러 차트에서 공통으로 자주 쓰는 설정이나 탬플릿을 한곳에 모아둔 차트 helm install불가, k8s리소스 생성X) 중 선택.
version: 0.1.0              # 차트 자체의 버전. 차트 변경 시 증가. 실제 이미지태그는 values.yaml에서 설정.
appVersion: "0.1.0"         # 차트에서 배포하는 애플리케이션의 버전. 실제 이미지태그는 values.yaml에서 설정.

maintainers:                # 차트 유지관리자 정보. 여러 명일 경우 배열로 추가 가능.
  - name: hailey            # 첫 번째 유지관리자 이름.
    url: https://github.com/hyemi-kwon # 유지관리자 GitHub URL.

keywords:                   # 검색용 키워드. Helm Hub 등에서 검색을 돕는다.
  - community
  - frontend
  - backend
  - kubernetes

home: https://github.com/hyemi-kwon/hailey-community   # 애플리케이션 또는 프로젝트 홈페이지 URL.
sources:                    # 관련 소스 코드 또는 레포지토리 목록.
  - https://github.com/hyemi-kwon/hailey-community
  - https://github.com/hyemi-kwon/hailey-k8s
