# Private Docker Hub 이미지 Pull에 사용할 기존 Secret
imagePullSecrets:   # 비공개 이미지(Private Image)를 다운받을 때 필요한 인증 정보를 지정합니다.
  - name: dockerhub-secret # 쿠버네티스에 미리 생성해둔 Secret의 이름입니다.

frontend:
  replicaCount: 2 # Deployment에서 유지할 Pod 복제 수

  image:
    repository: khm8992/hailey-community # Frontend 이미지 레포지토리
    tag: "frontend-a1065c270292b98190aa10f91296cc13f868399f" # Frontend 이미지 태그
    pullPolicy: IfNotPresent # 이미지가 로컬에 없을 경우에만 풀 (Always: 항상 풀, Never: 절대 풀 하지 않음)

  containerPort: 8080 # Frontend 컨테이너의 포트

  config:
    port: "8080"
    apiBaseUrl: "http://backend-service:8090" # Backend API Base URL

  service:
    # 외부 요청은 Ingress가 받고, Service는 클러스터 내부에서만 사용한다.
    type: ClusterIP
    port: 8080

  resources:         # Pod가 사용할 수 있는 최소/최대 리소스 제한을 설정한다. (CPU, Memory)
    requests:        # 최소보장자원
      cpu: "100m"    # 0.1 Core
      memory: "128Mi"
    limits:          # 최대사용자원
      cpu: "250m"
      memory: "256Mi"

backend:
  replicaCount: 2 # Deployment에서 유지할 Pod 복제 수

  image:
    repository: khm8992/hailey-community                    # Backend 이미지 레포지토리
    tag: "backend-a1065c270292b98190aa10f91296cc13f868399f" # Backend 이미지 태그
    pullPolicy: IfNotPresent                                # 이미지가 로컬에 없을 경우에만 풀 (Always: 항상 풀, Never: 절대 풀 하지 않음)

  containerPort: 8090 # Backend 컨테이너의 포트

  config:
    # Spring Boot 실행 환경
    # 실제 Secret 값은 Git에 저장하지 않고 기존 Secret을 참조한다.
    springProfilesActive: "prod"
    serverPort: "8090"
    corsAllowedOrigins: "http://dev.hailey.my:32080"

  service:
    # 클러스터 내부에서 백엔드 Pod와 통신할 때 사용한다. 외부 요청은 Ingress가 받고, Service는 클러스터 내부에서만 사용한다.
    type: ClusterIP  # Cluster 내부에서만 접속/ NodePort, LoadBalancer는 외부에서 접속 가능, ExternalName은 외부 서비스와 연결할 때 사용
    port: 8090

  # 실제 Secret 값은 Git에 저장하지 않고 기존 Secret을 참조한다.
  existingSecret:
    name: hailey-community-secret-backend
    datasourceUrlKey: SPRING_DATASOURCE_URL
    datasourceUsernameKey: SPRING_DATASOURCE_USERNAME
    datasourcePasswordKey: SPRING_DATASOURCE_PASSWORD


  resources: # 한 Pod가 사용할 수 있는 최소/최대 리소스 제한을 설정한다. (CPU, Memory)
    requests:
      cpu: "250m"  # 수정됨: requests 아래로 2칸 들여쓰기
      memory: "512Mi"
    limits:
      cpu: "750m"  # 수정됨: limits 아래로 2칸 들여쓰기
      memory: "1Gi"


ingress: # Ingress 설정
  host: dev.hailey.my
  enabled: true # Ingress를 사용할지 여부
  className: nginx # Ingress Controller의 className. Ingress Controller가 여러 개일 경우 특정 Ingress Controller를 지정할 수 있다.
  path: /
  pathType: Prefix # Prefix 경로가 지정된 접두사로 시작하면 매핑

resourceQuota: # 네임스페이스의 총량
  enabled: true # 리소스 할당량을 사용할지 여부
  hard: # 하드 리소스 할당량
    requestsCpu: "2"       # 수정됨: hard 아래로 2칸 들여쓰기
    requestsMemory: "4Gi"
    limitsCpu: "4"
    limitsMemory: "8Gi"
    pods: "10"

limitRange: # 네임스페이스 안 컨테이너 기본값, 최솟값, 최댓값. (resources 지정 안 하면 limitRange에 지정된 기본값이 적용됨)
  enabled: true
  container:
    min:            # 수정됨: container 아래로 2칸 들여쓰기
      cpu: "50m"    # min 아래로 2칸 들여쓰기
      memory: "64Mi"
    max:
      cpu: "2"      # max 아래로 2칸 들여쓰기
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"   # defaultRequest 아래로 2칸 들여쓰기
      memory: "128Mi"
    default:
      cpu: "500m"   # default 아래로 2칸 들여쓰기
      memory: "512Mi"
