apiVersion: networking.k8s.io/v1
kind: Ingress # 외부에서 HTTP/HTTPS 요청을 내부 서비스로 연결해줌
metadata:
  name: hailey-community-ingress
  namespace: {{ .Release.Namespace }} # 배포 시 지정된 네임스페이스 동적 주입
  labels:
    app: hailey-community

spec:
  # 처리할 Ingress Controller 지정 (예: nginx, alb 등)
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host | quote }} # 도메인(주소)으로 들어왔는가 (예: hailey.local)
      http:
        paths: # hailey.local로 들어온 요청 들 frontend-service로 전달
          - path: /v1  #도메인 뒤에 경로(Path)가 있는가 (예: / )
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: {{ .Values.backend.service.port }}
          - path: {{ .Values.ingress.path}}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}
