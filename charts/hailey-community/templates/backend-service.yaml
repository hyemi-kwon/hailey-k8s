apiVersion: v1 # 쿠버네티스 코어 API 버전
kind: Service # 생성할 리소스의 종류: 백엔드 파드(Pod)들에게 네트워크 통로를 제공하는 Service
metadata:
  name: backend-service # 이 서비스의 고유 이름 (프론트엔드가 백엔드를 찾을 때 이 이름을 사용합니다!)
  # Helm 템플릿 문법: 배포 시 지정된 네임스페이스를 동적으로 주입
  namespace: {{ .Release.Namespace }}
  labels: # 이 '서비스 리소스 자체'를 분류하기 위해 붙이는 꼬리표
    app: hailey-community
    tier: backend
spec: # 서비스의 네트워크 설정 명세
  # values.yaml에서 백엔드 서비스 타입(예: ClusterIP)을 가져와 주입
  type: {{ .Values.backend.service.type }}

  selector: # [핵심] 트래픽을 토스해 줄 목적지 파드(Pod)를 찾는 조건
    app: hailey-community # 이 라벨을 가지고 있고,
    tier: backend         # tier가 backend인 파드들을 모두 찾아서 묶어라!

  ports: # 포트 규칙 설정
    - name: http # 이 포트 규칙의 이름
      protocol: TCP # API(웹) 통신이므로 TCP 프로토콜 사용
      # 이 서비스(backend-service)가 노출할 포트 번호 (values.yaml 참조, 예: 8090)
      port: {{ .Values.backend.service.port }}
      # 최종적으로 트래픽을 전달받을 실제 백엔드 컨테이너의 포트 (숫자 대신 'http'라는 이름으로 지정된 포트로 전달)
      targetPort: http
